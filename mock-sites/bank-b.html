<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Beta Finance - Loan Rates</title></head>
<body>

    <tbody>
      <tr data-product-name="Beta Salary Advance" data-provider="Beta Finance" data-interest-rate="13.40"
          data-min-income="18000" data-min-score="670" data-min-age="22" data-max-age="58"
          data-employment="salaried" data-notes="Salary account with Beta preferred.">

      <tr data-product-name="Beta Business Boost" data-provider="Beta Finance" data-interest-rate="14.90"
          data-min-income="40000" data-min-score="700" data-min-age="25" data-max-age="65"
          data-employment="self-employed" data-notes="Business vintage of 2+ years.">
        <td>Beta Business Boost</td><td>14.90%</td><td>Income 40,000+, score 700+</td></tr>
      <tr data-product-name="Beta Everyday Loan" data-provider="Beta Finance" data-interest-rate="11.80"
          data-min-income="35000" data-min-score="740" data-min-age="23" data-max-age="60"
          data-employment="salaried,self-employed" data-notes="Quick disbursal in 24 hours.">
        <td>Beta Everyday Loan</td><td>11.80%</td><td>Income 35,000+, score 740+</td></tr>
    </tbody>
  </table>
</body>
</html>
